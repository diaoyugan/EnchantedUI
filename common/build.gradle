plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neoform_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.named('jar', Jar) {
    exclude 'LICENSE'
}

tasks.register('verifyIsolation') {
    group = 'verification'
    description = 'Checks that the common jar is a class-only, loader-neutral, relocatable GUI library.'
    dependsOn tasks.named('jar')

    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def forbiddenEntries = zipTree(jarFile).matching {
            include 'fabric.mod.json'
            include 'META-INF/mods.toml'
            include 'META-INF/neoforge.mods.toml'
            include '**/*.mixins.json'
            include 'assets/**'
            include 'data/**'
            include 'pack.mcmeta'
            include 'LICENSE'
            include '**/standalone/**'
        }.files

        if (!forbiddenEntries.empty) {
            throw new GradleException("Common jar contains non-relocatable resources or mod metadata: ${forbiddenEntries}")
        }

        def forbiddenSource = fileTree('src/main/java') {
            include '**/*.java'
        }.findAll { source ->
            def text = source.getText('UTF-8')
            text.contains('net.fabricmc.') ||
                    text.contains('net.neoforged.') ||
                    text.contains('org.lwjgl.') ||
                    text.contains('InputConstants.isKeyDown') ||
                    text.contains('KeyMapping.resetMapping') ||
                    text.contains('"eui.')
        }

        if (!forbiddenSource.empty) {
            throw new GradleException("Common sources cross the loader-neutral GUI boundary: ${forbiddenSource}")
        }
    }
}

tasks.register('verifyPresetBoundaries') {
    group = 'verification'
    description = 'Checks that reusable GUI controls do not depend on scenario-specific music types.'

    doLast {
        def musicPackage = 'top.diaoyugan.enchanted_ui.api.client.gui.music.'
        def rootEntrypoint = file('src/main/java/top/diaoyugan/enchanted_ui/api/client/gui/EnchantedUI.java')
        def leaks = fileTree('src/main/java') {
            include '**/*.java'
            exclude '**/api/client/gui/music/**'
        }.findAll { source ->
            source != rootEntrypoint && source.getText('UTF-8').contains(musicPackage)
        }

        if (!leaks.empty) {
            throw new GradleException("Reusable GUI code depends on the music preset: ${leaks}")
        }
    }
}

tasks.register('verifyFormModelBoundary') {
    group = 'verification'
    description = 'Checks that the removed parallel UI.Form model is not reintroduced.'

    doLast {
        def legacyReferences = fileTree('src/main/java') {
            include '**/*.java'
        }.findAll { source ->
            def text = source.getText('UTF-8')
            text.contains('client.gui.builder.UI') || text.contains('UI.Form') || text.contains('UI.BuildContext')
        }

        if (!legacyReferences.empty) {
            throw new GradleException("Sources reference the removed parallel form model: ${legacyReferences}")
        }
    }
}

tasks.register('verifyScreenRuntimeBoundary') {
    group = 'verification'
    description = 'Checks that extracted screen runtime responsibilities stay out of BaseTabbedScreen.'

    doLast {
        def baseScreen = file('src/main/java/top/diaoyugan/enchanted_ui/client/gui/screen/base/BaseTabbedScreen.java')
        def text = baseScreen.getText('UTF-8')
        def absorbedMembers = [
                'layoutAutomaticTabs(',
                'layoutVerticalTabs(',
                'layoutHorizontalTabs(',
                'shiftTabWindow(',
                'revealCurrentTab(',
                'closeConfirmed',
                'pageAttached',
                'private static final class PageView',
                'private final class ModalDialog',
                'private static final class ToastEntry',
                'private static final class BottomBarBackdropWidget'
        ].findAll { member -> text.contains(member) }

        if (!absorbedMembers.empty) {
            throw new GradleException("BaseTabbedScreen absorbed extracted runtime responsibilities: ${absorbedMembers}")
        }

        def collaboratorNames = [
                'TabStripController',
                'PageStackController',
                'PageViewport',
                'CloseCoordinator',
                'ScreenModal',
                'ToastController',
                'BottomBarBackdropWidget'
        ]
        def collaboratorDirectory = file('src/main/java/top/diaoyugan/enchanted_ui/client/gui/screen/base')
        def missingCollaborators = collaboratorNames.findAll { name ->
            !new File(collaboratorDirectory, "${name}.java").isFile()
        }
        if (!missingCollaborators.empty) {
            throw new GradleException("Screen runtime collaborators are missing: ${missingCollaborators}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyIsolation')
    dependsOn tasks.named('verifyPresetBoundaries')
    dependsOn tasks.named('verifyFormModelBoundary')
    dependsOn tasks.named('verifyScreenRuntimeBoundary')
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    dependsOn tasks.named('verifyIsolation')
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-common-${minecraft_version}"
        }
    }
}

